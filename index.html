<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Game Collection</title>
  <!-- Favicons Modern browsers - SVG (scalable, looks perfect at any size) -->
  <link rel="icon" type="image/svg+xml" href="src/images/favicons/favicon.svg">
  <!-- Fallback for browsers that don't support SVG -->
  <link rel="icon" type="image/png" sizes="96x96" href="src/images/favicons/favicon-96x96.png">
  <!-- Legacy support (older browsers, IE) -->
  <link rel="shortcut icon" href="src/images/favicons/favicon.ico">
  <!-- Apple Touch Icon (for iOS home screen) -->
  <link rel="apple-touch-icon" sizes="180x180" href="src/images/favicons/apple-touch-icon.png">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="src/css/bootstrap-overrides.min.css">
  <link rel="stylesheet" href="src/icons/icons.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- The Navigation Component -->
  <nav class="navbar navbar-expand-md">
    <div class="container-xxl">
      <a href="#" class="navbar-brand" data-page="home">Game Library</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">

        <ul class="navbar-nav my-2 my-md-0 gap-2 ms-auto">
          <li class="nav-item">
            <a href="/dashboard-page" class="nav-link">
              <i class="icon icon-grid"></i>
              <span class="nav-link-text">Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="/games-list-page" class="nav-link">
              <i class="icon icon-sheet"></i>
              <span class="nav-link-text">Games List</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="/settings-page" class="nav-link">
              <i class="icon icon-settings"></i>
              <span class="nav-link-text">Settings</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- The Main Content Area -->
  <div class="container-xxl flex-grow-1 position-relative">
    <main id="page-content" class="py-3">
      <!-- Content is loaded here -->
    </main>

    <!-- Toast Notifications -->
    <div class="toast-container position-absolute end-0 top-0 p-3">
      <div id="app-toast" class="toast" role="alert">
        <div class="toast-header">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="svg-md text-success me-2">
            <!-- JS -->
          </svg>
          <strong class="me-auto">
            <!-- Toast title will be inserted here -->
          </strong>
          <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body">
          <!-- Toast message will be inserted here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div class="modal fade" id="confirmation-modal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-fullscreen-md-down">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Please Confirm</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Message is injected here by alerts.js -->
        </div>
        <div class="modal-footer">
          <button type="button" id="cancel-btn" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="confirm-btn" class="btn btn-primary">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <!-- The Footer Component -->
  <footer>
    <div class="container d-flex align-items-center justify-content-center">
      <div class="m-4">
        <strong>Rafael Ferreira &copy; 2026</strong>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <!-- App JavaScript -->
  <script type="module" src="src/core/app.js"></script>
</body>

</html>
