<section>

  <h2 class="display-4 mb-5">Games List</h2>

  <!-- Options -->
  <div class="row g-2 mb-3">
    <!-- Search Input -->
    <div class="col-md-6">
      <div class="input-group">
        <span class="input-group-text">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="svg-md">
            <path d="m21 21-4.34-4.34" />
            <circle cx="11" cy="11" r="8" />
          </svg>
        </span>
        <input id="search-input" type="text" class="form-control" placeholder="Search by title">
      </div>
    </div>

    <!-- Display Input -->
    <div class="col-sm-6 col-md-3">
      <div class="input-group">
        <span class="input-group-text">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="svg-md">
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M21 9H3" />
            <path d="M21 15H3" />
          </svg>
        </span>
        <select class="form-select" id="display-items">
          <option value="10">10 games</option>
          <option value="15">15 games</option>
          <option value="20">20 games</option>
          <option value="25">25 games</option>
          <option value="all">All</option>
        </select>
      </div>
    </div> <!-- Options End -->

    <!-- Add Game Button -->
    <div class="col-sm-6 col-md-3">
      <button type="button" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#add-game">Add Game</button>
    </div>
  </div>

  <div id="games-container">
    <!-- JS -->
  </div>

</section>

<!-- Add Game Modal -->
<div class="modal fade" id="add-game" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-fullscreen-md-down">
    <form id="add-game-form" class="modal-content">
      <div class="modal-header p-2 px-3">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="svg-lg me-2">
          <path d="M11.146 15.854a1.207 1.207 0 0 1 1.708 0l1.56 1.56A2 2 0 0 1 15 18.828V21a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-2.172a2 2 0 0 1 .586-1.414z" />
          <path d="M18.828 15a2 2 0 0 1-1.414-.586l-1.56-1.56a1.207 1.207 0 0 1 0-1.708l1.56-1.56A2 2 0 0 1 18.828 9H21a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1z" />
          <path d="M6.586 14.414A2 2 0 0 1 5.172 15H3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h2.172a2 2 0 0 1 1.414.586l1.56 1.56a1.207 1.207 0 0 1 0 1.708z" />
          <path d="M9 3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2.172a2 2 0 0 1-.586 1.414l-1.56 1.56a1.207 1.207 0 0 1-1.708 0l-1.56-1.56A2 2 0 0 1 9 5.172z" />
        </svg>
        <h2 class="modal-title">New Game</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <div id="form-row" class="row">
          <!-- Form is rendered here by forms.js -->
        </div>
      </div>

      <div class="modal-footer">
        <button type="reset" class="btn btn-outline-warning">Clear</button>
        <button type="submit" class="btn btn-success">Save</button>
      </div>
    </form>
  </div>
</div>
