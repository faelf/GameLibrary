<section>

  <h2 class="display-4 mb-5">Games List</h2>

  <!-- Options -->
  <div class="row g-2 mb-3">
    <!-- Search Input -->
    <div class="col-md-6">
      <div class="input-group">
        <span class="input-group-text">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="svg-md">
            <path d="m21 21-4.34-4.34" />
            <circle cx="11" cy="11" r="8" />
          </svg>
        </span>
        <input id="search-input" type="text" class="form-control" placeholder="Search by title">
      </div>
    </div>

    <!-- Display Input -->
    <div class="col-sm-6 col-md-3 col-lg-4">
      <div class="input-group">
        <span class="input-group-text">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="svg-md">
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M21 9H3" />
            <path d="M21 15H3" />
          </svg>
        </span>
        <select class="form-select" id="display-items">
          <option value="10">10 games</option>
          <option value="15">15 games</option>
          <option value="20">20 games</option>
          <option value="25">25 games</option>
          <option value="all">All</option>
        </select>
      </div>
    </div> <!-- Options End -->

    <!-- Add Game Button -->
    <div class="col-sm-6 col-md-3 col-lg-2">
      <ui-btn-add-game></ui-btn-add-game>
    </div>
  </div>

  <!-- Table with games data -->
  <table id="games-table" class="table table-striped table-borderless table-hover">
    <!-- JavaScript -->
  </table>

  <!-- Pagination Links -->
  <nav id="pagination-controls" class="mt-3" aria-label="Game list navigation">
    <!-- JavaScript -->
  </nav>

  <!-- If there is no games -->
  <div id="empty-table">
    <!-- JavaScript -->
  </div>

</section>
